# Nightly: the slow drills CI cannot run on every push (scenarios, gates, a 10-minute soak,
# the eviction drill and the store failover drills on Valkey and Redis 7.4),
# and the engine integration tests with key expiry `swept` (CI runs them with `auto`).
# All on fakellm and the Docker stack; no real LLM and no secrets.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # evict: both eviction policies on their own Docker Valkey (~5 min); failover: the three
        # store failover drills on Valkey 8.1 and on Redis 7.4 (~3 min each) (gap G18).
        drill: [scenarios, gates, soak10, evict, failover, failover-redis74]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: false  # scheduled runs never restore a cache (cache poisoning)
      - run: uv sync --all-extras --locked
      - run: docker compose -f docker/compose.yaml up -d --wait
      - if: matrix.drill == 'scenarios'
        run: uv run python scripts/scenarios.py all --load under --jobs 4
      - if: matrix.drill == 'gates'
        run: uv run python scripts/gates.py --quick
      - if: matrix.drill == 'soak10'
        run: uv run python scripts/soak.py --minutes 10
      - if: matrix.drill == 'evict'
        run: uv run python scripts/evict_drill.py --calls 500
      - if: matrix.drill == 'failover'
        run: uv run python scripts/failover.py
      - if: matrix.drill == 'failover-redis74'
        run: uv run python scripts/failover.py --image redis:7.4-alpine
      - if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: reports-${{ matrix.drill }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose -f docker/compose.yaml down

  swept:
    # The engine integration tests with no native TTLs: every expiry in the index `P:ttl`
    # (LLMQ_KEY_EXPIRY_MODE=swept, as on a shared volatile-* store). Same stack as CI's integration.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: false  # scheduled runs never restore a cache (cache poisoning)
      - run: uv sync --all-extras --locked
      - run: docker compose -f docker/compose.yaml up -d --wait
      - run: uv run pytest tests/integration/engine -q
        env:
          LLMQ_TEST_KEY_EXPIRY: swept
      - if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f docker/compose.yaml down
