# Docs site (Zensical) on GitHub Pages.
# Every pull request builds it with --strict (a broken link fails). A release tag (v*), or a
# manual run (Actions > Docs > Run workflow), deploys it, so the site shows the latest release.
# One-time owner setup: Settings > Pages > Source: GitHub Actions; and in Settings >
# Environments > github-pages, allow `main` and tags `v*` to deploy.
name: Docs

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false  # release builds never restore a cache (cache poisoning)
      # Pinned: Zensical is 0.x, its config and plugins may change between versions.
      - run: uvx --with "mkdocstrings-python==2.0.11" "zensical==0.1.1" build --clean --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        id: deployment
