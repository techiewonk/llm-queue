# Lint, type-check and test on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by publish.yml so a release always runs the full checks

permissions:
  contents: read

# One run per branch or pull request; a new push cancels the old one (R3RL-14).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests build the package too, so a packaging break shows up before a release
    # (R3RL-8): build, strict metadata check, install the wheel in a clean venv, import, run the CLI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false
      - run: uv build --no-sources
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: |
          uv venv --python 3.12 try
          uv pip install --python try dist/*.whl
          try/bin/python -c "from llm_queue import LLMQueue, CallFailed, Tuning; import llm_queue; print(llm_queue.__version__)"
          try/bin/llm-queue --help > /dev/null
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python || 'default' }}
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit -q

  windows:
    # Unit tests on Windows: paths, the proactor event loop, process handling in the fakes.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest tests/unit -q

  lowest:
    # Oldest versions the ranges in pyproject allow: catches floors that are wrong in practice.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --resolution lowest-direct
      - run: uv run pytest tests/unit -q

  langchain-03:
    # The dev lock is on the LangChain 1.x line; the extras also allow 0.3, so test the adapters there.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: >-
          uv pip install "langchain-core>=0.3.68,<0.4" "langchain-aws>=0.2.24,<0.3"
          "langchain-openai>=0.3.26,<0.4" "langgraph>=0.2,<1" "openai>=1.40,<2"
      # The adapters are tested against the stack (test_front.py); there is no unit-only suite.
      - run: docker compose -f docker/compose.yaml up -d --wait
      - run: uv run --no-sync pytest tests/integration/engine/test_front.py -q

  integration:
    # Valkey 8.1, Redis 7.4 and fakellm from docker/compose.yaml (same stack as local).
    # The oldest and newest Python too: asyncio's timeouts and loop internals differ.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python || 'default' }}
      - run: uv sync --all-extras --locked
      - run: docker compose -f docker/compose.yaml up -d --wait
      # Branch coverage on one version (fail_under in pyproject.toml); the others only run.
      - if: matrix.python == '3.12'
        run: uv run pytest tests/unit tests/integration -q --cov --cov-report=term
      - if: matrix.python != '3.12'
        run: uv run pytest tests/unit tests/integration -q
      # The usage samples as an app runs them, then a short load drill with a throughput floor.
      - run: uv run python scripts/samples.py --out reports/samples-ci
      # Every sample's output and a summary, kept with the run (Actions > run > Artifacts).
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: samples-${{ matrix.python }}
          path: reports/samples-ci/
          if-no-files-found: ignore
      - run: uv run python scripts/load.py throughput --calls 500 --min-rate 20
      - if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f docker/compose.yaml down

  zizmor:
    # Static security audit of these workflows (https://docs.zizmor.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false
      - run: uvx zizmor==1.32.0 --format=github .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
