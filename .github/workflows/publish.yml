# Build once, then publish with PyPI trusted publishing (OIDC): no API token is stored anywhere.
# - Manual run ("Run workflow")  -> TestPyPI
# - Publishing a GitHub release  -> PyPI
# One-time setup on (test.)pypi.org: add a trusted publisher for this repo, workflow
# `publish.yml`, environment `testpypi` / `pypi`.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Never publish a tree that fails lint, types or tests.

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false  # release builds never restore a cache (cache poisoning)
      - run: uv build --no-sources
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
